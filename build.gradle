plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

version = project.mod_version

def resourceRoot = layout.projectDirectory.dir('flora/src/main/resources').asFile
def resourceJsonFiles = fileTree(resourceRoot) { include '**/*.json' }
def forbiddenResourceFiles = fileTree(resourceRoot) {
    include 'data/byg/**', 'assets/byg/**', 'data/biomeswevegone/**', 'assets/biomeswevegone/**'
}

tasks.register('verifySourceResources') {
    inputs.dir(resourceRoot)
    doLast {
        def parser = new groovy.json.JsonSlurper()
        resourceJsonFiles.each { parser.parse(it) }
        def catalog = parser.parse(new File(resourceRoot, 'chromusflora/catalog.json'))
        if (catalog.trees*.id.toSet().size() != catalog.trees.size()
                || catalog.biomes*.id.toSet().size() != catalog.biomes.size()) {
            throw new GradleException('Duplicate tree or biome ID in Chromus Flora catalog')
        }
        def treeIds = catalog.trees*.id.toSet()
        catalog.biomes.each {
            if (!(it.dimension in ['overworld', 'nether', 'end']) || !treeIds.containsAll(it.trees)) {
                throw new GradleException("Invalid dimension or unknown tree in biome: ${it.id}")
            }
            if (!new File(resourceRoot, "data/chromusflora/worldgen/biome/${it.id}.json").isFile()) {
                throw new GradleException("Missing biome: ${it.id}")
            }
            def biome = parser.parse(new File(resourceRoot, "data/chromusflora/worldgen/biome/${it.id}.json"))
            def features = biome.features.flatten()
            if (biome.features.size() != 11 || features.toSet().size() != features.size()) {
                throw new GradleException("Duplicate feature or invalid generation steps in biome: ${it.id}")
            }
        }
        def compatibility = parser.parse(new File(resourceRoot, 'chromusflora/jaiz-compatibility.json'))
        if (compatibility.features.toSet().size() != compatibility.features.size()
                || compatibility.spawns.toSet().size() != compatibility.spawns.size()) {
            throw new GradleException('Duplicate Jaiz compatibility rule')
        }
        resourceJsonFiles.each { resource ->
            if (resource.path.replace('\\', '/').contains('/worldgen/configured_feature/forms/')) {
                def form = parser.parse(resource)
                if (form.type != 'chromusflora:bounded_tree' || form.config.orientation != 'STANDARD'
                        || !form.config.decorators.isEmpty()) {
                    throw new GradleException("Unreviewed tree placement footprint: ${resource.name}")
                }
            }
        }
        catalog.trees.each {
            ['planks', 'slab', 'stairs', 'fence', 'fence_gate', 'wood', 'door', 'trapdoor', 'crafting_table', 'chest'].each { suffix ->
                def name = it.id + '_' + suffix
                if (!new File(resourceRoot, "data/chromusflora/recipe/${name}.json").isFile()
                        || !new File(resourceRoot, "data/chromusflora/advancement/recipes/${name}.json").isFile()) {
                    throw new GradleException("Missing recipe or unlock: ${name}")
                }
            }
            ['log', 'leaves', 'sapling', 'planks', 'wood', 'door', 'trapdoor', 'crafting_table', 'chest'].each { suffix ->
                if (!new File(resourceRoot, "assets/chromusflora/blockstates/${it.id}_${suffix}.json").isFile()) {
                    throw new GradleException("Missing blockstate: ${it.id}_${suffix}")
                }
            }
        }
        if (!forbiddenResourceFiles.isEmpty()) { throw new GradleException('Legacy resources entered the new source set') }
    }
}

tasks.named('build') { dependsOn ':mc26_2:build', ':mc26_3:build' }
tasks.named('check') { dependsOn 'verifySourceResources', ':mc26_2:check', ':mc26_3:check' }
tasks.named('clean') { dependsOn ':mc26_2:clean', ':mc26_3:clean' }

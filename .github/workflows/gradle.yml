name: Chromus Flora - Build and validate

on:
  push:
    branches: ["26.2"]
  pull_request:
    branches: ["26.2"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
          cache-provider: basic

      - name: Build and check resources
        run: gradle build --no-daemon --warning-mode=fail --stacktrace

      - name: Validate mod JAR
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          jars = [p for p in Path('build/libs').glob('*.jar')
                  if not p.name.endswith(('-sources.jar', '-javadoc.jar', '-dev.jar'))]
          if len(jars) != 1:
              raise SystemExit(f'Expected one mod JAR, found: {jars}')
          jar = jars[0]
          with ZipFile(jar) as archive:
              damaged = archive.testzip()
              if damaged:
                  raise SystemExit(f'Corrupt JAR entry: {damaged}')
              names = set(archive.namelist())
              metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != 'chromusflora':
                  raise SystemExit('Incorrect mod ID')
              version = metadata.get('version', '')
              if not version or '${' in version:
                  raise SystemExit('Missing or unexpanded mod version')
              for entries in metadata.get('entrypoints', {}).values():
                  for entry in entries:
                      value = entry if isinstance(entry, str) else entry['value']
                      cls = value.split('::', 1)[0].replace('.', '/') + '.class'
                      if cls not in names:
                          raise SystemExit(f'Missing entrypoint class: {cls}')
              root = Path('flora/src/main/resources')
              if not root.is_dir():
                  raise SystemExit('Source resource directory is missing')
              required = {p.relative_to(root).as_posix()
                          for p in root.rglob('*') if p.is_file()}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Resources missing from JAR: {missing}')
          print(f'PASS: {jar} | version {version} | {len(required)} resources')
          PY

      - name: Upload validated mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: chromus-flora-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14

  dependency-submission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
        with:
          gradle-version: '9.5.1'
          cache-provider: basic

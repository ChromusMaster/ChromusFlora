name: Chromus Flora - build and validate

on:
  push:
    branches: ["26.2", "26.3"]
  pull_request:
    branches: ["26.2", "26.3"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static-check dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Verify sources and resources
        run: |
          python tools/scan.py
          python tools/check-release.py
          python tools/check-joinery.py
          python tools/check-door-gallery.py
      - name: Build both targets
        run: gradle build --no-daemon --warning-mode=fail
      - name: Validate both JARs
        run: python tools/verify-jars.py
      - uses: actions/upload-artifact@v4
        with:
          name: chromus-flora-two-versions
          path: |
            build/26.2/chromus-flora-*-26.2.jar
            build/26.3/chromus-flora-*-26.3.jar
          if-no-files-found: error
